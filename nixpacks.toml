# Railway: use apt Python so /usr/bin/python3 exists at runtime. Nix-only Python often lives
# under /nix/store and is missing from the final run image, which breaks .venv shebangs (ENOENT).
[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv", "build-essential"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m venv .venv",
  ".venv/bin/pip install -U pip",
  ".venv/bin/pip install -r chatbot-ai/requirements.txt",
]
